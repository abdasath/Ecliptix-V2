<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecliptix - Your Ultimate Gaming Platform</title>
    <link rel="icon" type="image/png" href="https://i.pinimg.com/736x/07/3e/90/073e9014436b6ce0c67ebded83e854ff.jpg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="container">
            <div class="nav-brand">
                <a href="index.html">
                    <h1>Ecliptix</h1>
                </a>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html" class="active">Store</a></li>
                <li><a href="library.html">Library</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="admin.html">Admin</a></li>
            </ul>
            <div class="nav-actions">
                <div class="search-box">
                    <input type="text" id="searchInput" class="search-input" placeholder="Search games...">

                    <button id="searchBtn" class="search-btn">
                        <i class='bx bx-search'></i>
                    </button>
                </div>
                <div class="cart-icon" id="cartIcon">
                    <span>🛒</span>
                    <span class="cart-count" id="cartCount">0</span>
                </div>
                <div class="user-menu">
                    <span id="userWallet" class="wallet">₹0</span>
                    <button id="loginBtn" class="btn-primary">Login</button>
                    <button id="logoutBtn" class="btn-secondary" style="display: none;">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-content">
            <h2>Discover Your Next Adventure</h2>
            <p>Browse thousands of games and find your perfect match</p>
        </div>
    </section>

    <!-- Main Content -->
    <main class="container">
        <!-- Featured Games -->
        <section class="featured-section">
            <h2 class="section-title">Featured Games</h2>
            <div class="games-grid" id="featuredGames">
                <!-- Games will be loaded here -->
            </div>
        </section>

        <!-- All Games -->
        <section class="games-section">
            <div class="section-header">
                <h2 class="section-title">All Games</h2>
                <div class="filters">
                    <select id="genreFilter">
                        <option value="">All Genres</option>
                    </select>
                    <select id="sortFilter">
                        <option value="">Sort By</option>
                        <option value="newest">Newest</option>
                        <option value="priceLowHigh">Price: Low to High</option>
                        <option value="priceHighLow">Price: High to Low</option>
                        <option value="highestRated">Highest Rated</option>
                    </select>


                </div>
            </div>
            <div class="games-grid" id="gamesGrid">
                <!-- Games will be loaded here -->
            </div>
            <div class="pagination" id="pagination">
                <!-- Pagination will be loaded here -->
            </div>
        </section>
    </main>

    <!-- Login Modal -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Login / Register</h2>
            <form id="authForm">
                <div class="form-group">
                    <label>Username (for register)</label>
                    <input type="text" id="username" placeholder="Username">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="Email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Password">
                </div>
                <button type="button" id="loginSubmit" class="btn-primary">Login</button>
                <button type="button" id="registerSubmit" class="btn-secondary">Register</button>
            </form>
        </div>
    </div>

    <!-- Cart Modal -->
    <div id="cartModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Shopping Cart</h2>
            <div id="cartItems">
                <!-- Cart items will be loaded here -->
            </div>
            <div class="cart-total">
                <strong>Total: ₹<span id="cartTotal">0</span></strong>
            </div>
            <button id="checkoutBtn" class="btn-primary">Checkout</button>
        </div>
    </div>

    <!-- Game Details Modal -->
    <div id="gameModal" class="modal modal-large">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="gameDetails">
                <!-- Game details will be loaded here -->
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/games.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
