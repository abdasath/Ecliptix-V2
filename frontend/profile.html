<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Ecliptix</title>
    <link rel="icon" type="image/png" href="https://i.pinimg.com/736x/07/3e/90/073e9014436b6ce0c67ebded83e854ff.jpg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar">
         <button class="menu-toggle" style="display: none;">☰</button> 
        <div class="container">

            <div class="nav-brand">
                <a href="index.html">
                    <h1>Ecliptix</h1>
                </a>
            </div>

            <ul class="nav-menu">
                <li><a href="index.html" class="active">Store</a></li>
                <li><a href="library.html">Library</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="admin.html">Admin</a></li>
            </ul>

            <div class="nav-actions">
                ...
            </div>

        </div>
    </nav>

    <!-- Main Content -->
    <main class="container">
        <section class="profile-section">
            <h2 class="section-title">My Profile</h2>
            <div class="profile-content">
                <div class="profile-card">
                    <h3>Account Information</h3>
                    <div class="profile-info">
                        <p><strong>Username:</strong> <span id="profileUsername">-</span></p>
                        <p><strong>Email:</strong> <span id="profileEmail">-</span></p>
                        <p><strong>Member Since:</strong> <span id="profileDate">-</span></p>
                    </div>
                </div>

                <div class="profile-card">
                    <h3>Wallet</h3>
                    <div class="wallet-section">
                        <p class="wallet-balance">Balance: ₹<span id="profileWallet">0</span></p>
                        <div class="add-funds">
                            <input type="number" id="fundAmount" placeholder="Amount" min="1" step="0.01">
                            <button id="addFundsBtn" class="btn-primary">Add Funds</button>
                        </div>
                    </div>
                </div>

                <div class="profile-card">
                    <h3>Purchase History</h3>
                    <div id="orderHistory">
                        <!-- Orders will be loaded here -->
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Login Modal -->
    <div id="loginModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Login / Register</h2>
            <form id="authForm">
                <div class="form-group">
                    <label>Username (for register)</label>
                    <input type="text" id="username" placeholder="Username">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="Email">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Password">
                </div>
                <button type="button" id="loginSubmit" class="btn-primary">Login</button>
                <button type="button" id="registerSubmit" class="btn-secondary">Register</button>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/app.js"></script>
</body>
</body>

</html>
