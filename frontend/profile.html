<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - Ecliptix</title>
    <link rel="icon" type="image/png" href="https://i.pinimg.com/736x/07/3e/90/073e9014436b6ce0c67ebded83e854ff.jpg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar">
        <button class="menu-toggle" style="display: none;">
            <span class="icon hamburger">☰</span>
            <span class="icon close">✕</span>
        </button>
        <div class="container">

            <div class="nav-brand">
                <a href="/">
                    <h1>Ecliptix</h1>
                </a>
            </div>

            <ul class="nav-menu">
                <li><a href="/">Store</a></li>
                <li><a href="/library">Library</a></li>
                <li><a href="/profile" class="active">Profile</a></li>
                <li id="adminNavLink" style="display: none;"><a href="/admin">Admin</a></li>
            </ul>

           

        </div>
    </nav>

    <!-- Main Content -->
    <main class="container">
        <section class="profile-section">
            <h2 class="section-title">My Profile</h2>
            <div class="profile-content">
                <div class="profile-card">
                    <h3>Account Information</h3>
                    <div class="profile-info">
                        <p><strong>Username:</strong> <span id="profileUsername">-</span></p>
                        <p><strong>Email:</strong> <span id="profileEmail">-</span></p>
                        <p><strong>Member Since:</strong> <span id="profileDate">-</span></p>
                    </div>
                </div>

                <div class="profile-card">
                    <h3>Wallet</h3>
                    <div class="wallet-section">
                        <p class="wallet-balance">Balance: ₹<span id="profileWallet">0</span></p>
                        <div class="add-funds">
                            <input type="number" id="fundAmount" placeholder="Amount" min="1" step="0.01">
                            <button id="addFundsBtn" class="btn-primary">Add Funds</button>
                        </div>
                    </div>
                </div>

                <div class="profile-card">
                    <h3>Purchase History</h3>
                    <div id="orderHistory">
                        <!-- Orders will be loaded here -->
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="loginModal" class="modal">
        <div class="container-auth" id="authContainer">
            <span class="close" onclick="closeLoginModal()">&times;</span>

            <div class="form-box login">
                <form id="loginForm">
                    <h1>Login</h1>
                    <div class="input-box">
                        <input type="email" id="loginEmail" placeholder="Email" required>
                        <i class='bx bxs-envelope'></i>
                    </div>
                    <div class="input-box">
                        <input type="password" id="loginPassword" placeholder="Password" required>
                        <i class='bx bxs-lock-alt'></i>
                    </div>
                    <button type="button" id="loginSubmitBtn" class="btn-auth">Login</button>
                </form>
            </div>

            <div class="form-box register">
                <form id="registerForm">
                    <h1>Registration</h1>
                    <div class="input-box">
                        <input type="text" id="regUsername" placeholder="Username" required>
                        <i class='bx bxs-user'></i>
                    </div>
                    <div class="input-box">
                        <input type="email" id="regEmail" placeholder="Email" required>
                        <i class='bx bxs-envelope'></i>
                    </div>
                    <div class="input-box">
                        <input type="password" id="regPassword" placeholder="Password" required>
                        <i class='bx bxs-lock-alt'></i>
                    </div>
                    <button type="button" id="registerSubmitBtn" class="btn-auth">Register</button>
                </form>
            </div>

            <div class="toggle-box">
                <div class="toggle-panel toggle-left">
                    <h1>Welcome to Ecliptix</h1>
                    <p>Create an account to get started.</p>
                    <button class="btn-auth toggle-btn" id="toRegister">Create Account</button>
                </div>
                <div class="toggle-panel toggle-right">
                    <h1>Welcome Back</h1>
                    <p>Sign in to continue.</p>
                    <button class="btn-auth toggle-btn" id="toLogin">Sign In</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/app.js"></script>
</body>
</body>

</html>
