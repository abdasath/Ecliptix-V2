<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Library - Ecliptix</title>
    <link rel="icon" type="image/png" href="https://i.pinimg.com/736x/07/3e/90/073e9014436b6ce0c67ebded83e854ff.jpg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/components.css">
</head>

<body>
    <!-- Navigation -->
    <nav class="navbar">
        <button class="menu-toggle" style="display: none;">
            <span class="icon hamburger">☰</span>
            <span class="icon close">✕</span>
        </button>
        <div class="container">
            <div class="nav-brand">
                <a href="index.html">
                    <h1>Ecliptix</h1>
                </a>
            </div>
            <ul class="nav-menu">
                <li><a href="index.html">Store</a></li>
                <li><a href="library.html" class="active">Library</a></li>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="admin.html">Admin</a></li>
            </ul>
            <div class="nav-actions">
                <div class="search-box">
                    <input type="text" id="searchInput" class="search-input" placeholder="Search games...">

                    <button id="searchBtn" class="search-btn">
                        <i class='bx bx-search'></i>
                    </button>
                </div>
                <div class="cart-icon" id="cartIcon">
                    <span>🛒</span>
                    <span class="cart-count" id="cartCount">0</span>
                </div>
                <div class="user-menu">
                    <span id="userWallet" class="wallet">₹0</span>
                    <button id="loginBtn" class="btn-primary">Login</button>
                    <button id="logoutBtn" class="btn-secondary" style="display: none;">Logout</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="container">
        <section class="library-section">
            <h2 class="section-title">My Game Library</h2>
            <div id="libraryGames" class="games-grid">
                <!-- Owned games will be loaded here -->
            </div>
            <div id="emptyLibrary" class="empty-state" style="display: none;">
                <p>Your library is empty. Start building your collection!</p>
                <a href="index.html" class="btn-primary">Browse Store</a>
            </div>
        </section>
    </main>

     <div id="loginModal" class="modal">
        <div class="container-auth" id="authContainer">
            <span class="close" onclick="closeLoginModal()">&times;</span>

            <div class="form-box login">
                <form id="loginForm">
                    <h1>Login</h1>
                    <div class="input-box">
                        <input type="email" id="loginEmail" placeholder="Email" required>
                        <i class='bx bxs-envelope'></i>
                    </div>
                    <div class="input-box">
                        <input type="password" id="loginPassword" placeholder="Password" required>
                        <i class='bx bxs-lock-alt'></i>
                    </div>
                    <button type="button" id="loginSubmitBtn" class="btn-auth">Login</button>
                </form>
            </div>

            <div class="form-box register">
                <form id="registerForm">
                    <h1>Registration</h1>
                    <div class="input-box">
                        <input type="text" id="regUsername" placeholder="Username" required>
                        <i class='bx bxs-user'></i>
                    </div>
                    <div class="input-box">
                        <input type="email" id="regEmail" placeholder="Email" required>
                        <i class='bx bxs-envelope'></i>
                    </div>
                    <div class="input-box">
                        <input type="password" id="regPassword" placeholder="Password" required>
                        <i class='bx bxs-lock-alt'></i>
                    </div>
                    <button type="button" id="registerSubmitBtn" class="btn-auth">Register</button>
                </form>
            </div>

            <div class="toggle-box">
                <div class="toggle-panel toggle-left">
                    <h1>Welcome to Ecliptix</h1>
                    <p>Create an account to get started.</p>
                    <button class="btn-auth toggle-btn" id="toRegister">Create Account</button>
                </div>
                <div class="toggle-panel toggle-right">
                    <h1>Welcome Back</h1>
                    <p>Sign in to continue.</p>
                    <button class="btn-auth toggle-btn" id="toLogin">Sign In</button>
                </div>
                
            </div>
            
        </div>
        
    </div>
    <div id="cartModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Shopping Cart</h2>
            <div id="cartItems">
                </div>
            <div class="cart-total">
                <strong>Total: ₹<span id="cartTotal">0</span></strong>
            </div>
            <button id="checkoutBtn" class="btn-primary">Checkout</button>
        </div>
    </div>
    

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/games.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/library.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
